<script>
	// 根据当前页面URL确定语言
	function getCurrentLang() {
		const path = window.location.pathname;
		if (path.includes('zh-cn')) {
			return 'zh-cn';
		}
		return 'ja'; // 默认为日语
	}

	// 根据语言获取对应的内容文件
	function getContentFile(lang) {
		switch(lang) {
			case 'ja':
				return 'static/content_jp.json';
			case 'zh-cn':
			default:
				return 'static/content_zh.json';
		}
	}

	// 更新语言切换按钮状态
	function updateLanguageButtons() {
		const currentLang = getCurrentLang();
		const jaBtn = document.querySelector('a[href="/index.html"]');
		const zhBtn = document.querySelector('a[href="/index.zh-cn.html"]');
		
		if (currentLang === 'ja') {
			jaBtn.classList.add('on');
			zhBtn.classList.remove('on');
		} else {
			zhBtn.classList.add('on');
			jaBtn.classList.remove('on');
		}
	}

	// 加载内容并渲染页面
	function loadContent() {
		const currentLang = getCurrentLang();
		const contentFile = getContentFile(currentLang);
		
		fetch(contentFile)
			.then(res => res.json())
			.then(data => {
				// 更新页面标题
				document.title = data.site_title;
				
				// アバウト
				document.getElementById('about-me-title').innerHTML = data.about.me_title;
				document.getElementById('about-me-content').innerHTML = data.about.me_content;
				// タイトル
				document.getElementById('contact-title').innerHTML = data.titles.contact_title;
				document.getElementById('projects-books-title').innerHTML = data.titles.projects_books_title;
				document.getElementById('books-title').innerHTML = data.titles.books_title;
				document.getElementById('projects-title').innerHTML = data.titles.projects_title;
				document.getElementById('events-title').innerHTML = data.titles.events_title;
				// 連絡先
				document.getElementById('contact-twitter-label').innerHTML = data.contact.twitter_label;
				document.getElementById('contact-twitter').innerHTML = data.contact.twitter;
				document.getElementById('contact-twitter').href = data.contact.twitter_link;
				document.getElementById('contact-email-label').innerHTML = data.contact.email_label;
				document.getElementById('contact-email').innerHTML = data.contact.email;
				document.getElementById('contact-email').href = data.contact.email_link;
				// 简历下载按钮
				document.getElementById('resume-download-btn').innerHTML = data.resume_download_text;
				// 書籍
				let booksList = document.getElementById('project-items');
				booksList.innerHTML = '';
				data.books.list.forEach(book => {
					let div = document.createElement('div');
					div.className = 'b';
					div.innerHTML = `<a class="img" href="${book.link}" target="_blank" title="${book.title}"><img src="${book.img}" class="img-responsive center-block" alt="${book.title}"></a><div class="i"><h5><a title="${book.title}" target="_blank" href="${book.link}">${book.title}</a></h5><span class="link">${book.publisher}<br>ISBN: ${book.isbn}<br>出版时间：${book.date}<br>${book.extra || ''}</span></div>`;
					booksList.appendChild(div);
				});
				// web-project-list 渲染
				let webProjectList = document.getElementById('web-project-items');
				webProjectList.innerHTML = '';
				if (data.web_project_list && data.web_project_list.length > 0) {
					data.web_project_list.forEach(item => {
						let div = document.createElement('div');
						div.className = 'b';
						div.innerHTML = `<a class="img" href="${item.link}" target="_blank" title="${item.title}"><img src="${item.img}" class="img-responsive center-block" alt="${item.title}"></a><div class="i"><h5><a title="${item.title}" target="_blank" href="${item.link}">${item.title}</a></h5><span class="link">${item.extra || ''}</span></div>`;
						webProjectList.appendChild(div);
					});
				}
				
				// プロジェクト
				let projectsList = document.getElementById('projects-list');
				projectsList.innerHTML = '';
				data.projects.list.forEach(item => {
					let li = document.createElement('li');
					li.className = 'l link';
					li.innerHTML = `<span class="w0"><a href="${item.link}" target="_blank" title="${item.title}">${item.year}&nbsp;&nbsp;${item.title}</a></span><i><span class="w1">${item.info}</span><span class="w2">${item.role}</span></i>`;
					projectsList.appendChild(li);
				});
				let projectsImgList = document.getElementById('projects-img-list');
				projectsImgList.innerHTML = '';
				data.projects.imgs.forEach(img => {
					let li = document.createElement('li');
					li.innerHTML = `<a href="${img.link}" target="_blank"><img class="img" src="${img.img}" alt="${img.alt}" title="${img.title}"></a>`;
					projectsImgList.appendChild(li);
				});
				// 年度イベント
				let eventsHtml = '';
				data.events.years.forEach(yearBlock => {
					eventsHtml += `<h5>${yearBlock.year}</h5><ul class="link">`;
					yearBlock.items.forEach(item => {
						if (item.link) {
							eventsHtml += `<li><a href="${item.link}" target="_blank">${item.text}</a>（${item.date}）</li>`;
						} else {
							eventsHtml += `<li>${item.text}（${item.date}）</li>`;
						}
					});
					eventsHtml += '</ul>';
				});
				document.getElementById('events-list').innerHTML = eventsHtml;
			})
			.catch(error => {
				console.error('加载内容失败:', error);
			});
	}

	// 页面加载时初始化
	document.addEventListener('DOMContentLoaded', function() {
		updateLanguageButtons();
		loadContent();
	});

	// 语言切换现在通过直接跳转页面实现，无需JavaScript处理
</script>
